{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obrigado | FinPro Gestão Financeira</title>
    <meta name="description" content="Confirmação de cadastro e informações de suporte do sistema FinPro.">
    <link rel="icon" type="image/png" href="{% static 'icone.png' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">
    <main class="bg-white border rounded-2 p-4 shadow-sm text-center" style="max-width: 440px; width: 100%;">
        <img src="{% static 'icone.png' %}" alt="Logotipo FinPro" width="44" height="44" class="mb-3" style="border-radius: 6px;">
        <h1 class="h5 fw-bold mb-2">Obrigado por utilizar o FinPro</h1>
        <p class="small text-secondary mb-4">
            Sua conta está ativa e configurada com isolamento de dados e proteção criptográfica.
        </p>
        <a href="{% url 'dashboard' %}" class="btn btn-primary w-100 rounded-2 py-2 fw-semibold">
            Ir para o Painel Principal
        </a>
    </main>
</body>
</html>
