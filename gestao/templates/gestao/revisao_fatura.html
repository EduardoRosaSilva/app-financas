<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisão de Fatura - FinPro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; }
        .form-control, .form-select { font-size: 0.85rem; } /* Deixa as fontes mais delicadas no celular */
    </style>
</head>
<body>
    <div class="bg-white sticky-top shadow-sm py-3 mb-4 rounded-bottom-5">
        <div class="container d-flex justify-content-between align-items-center px-4">
            <h4 class="fw-bold text-primary mb-0"><i class="bi bi-wallet2"></i> FinPro</h4>
            <a href="{% url 'dashboard' %}" class="btn btn-light text-secondary rounded-pill px-3 fw-bold border shadow-sm" style="font-size: 0.85rem;">Cancelar</a>
        </div>
    </div>

    <div class="container pb-5 mb-5">
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-3 p-md-4">
                <h5 class="fw-bold text-dark mb-1"><i class="bi bi-check2-square text-primary"></i> Conciliação de Fatura</h5>
                <p class="text-muted small mb-4">Revise os itens importados antes de enviá-los ao banco.</p>
                
                <form method="POST" action="{% url 'dashboard' %}">
                    {% csrf_token %}
                    <input type="hidden" name="form_type" value="salvar_fatura_lote">
                    
                    <div class="mb-4 bg-light p-3 rounded-4 border">
                        <label class="form-label text-secondary fw-bold small mb-1">Esses gastos caíram em qual cartão?</label>
                        <select class="form-select bg-white border-0 rounded-3 py-2" name="cartao_lote" required>
                            <option value="">Selecione um Cartão...</option>
                            {% for c in cartoes %}
                            <option value="{{ c.id }}">{{ c.nome }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="list-group mb-4">
                        {% for t in transacoes_fatura %}
                        <div class="list-group-item bg-white border rounded-4 mb-3 p-3 shadow-sm">
                            
                            <!-- Header do Card: Checkbox -->
                            <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
                                <div class="form-check form-switch">
                                    <input type="checkbox" name="importar_chk" value="{{ t.id_temp }}" checked class="form-check-input" style="width: 2.5em; height: 1.25em; cursor: pointer;" id="chk_{{ t.id_temp }}">
                                    <label class="form-check-label fw-bold text-primary ms-2 pt-1" for="chk_{{ t.id_temp }}">Importar este Gasto</label>
                                </div>
                            </div>
                            
                            <!-- Campos Empilhados Responsivos -->
                            <div class="row g-2">
                                <div class="col-12 col-md-6">
                                    <label class="form-label text-secondary small mb-1">Estabelecimento</label>
                                    <input type="text" name="desc_{{ t.id_temp }}" value="{{ t.descricao }}" class="form-control bg-light border-0 rounded-3">
                                </div>
                                <div class="col-6 col-md-3">
                                    <label class="form-label text-secondary small mb-1">Valor (R$)</label>
                                    <input type="text" name="valor_{{ t.id_temp }}" value="{{ t.valor|floatformat:2 }}" class="form-control bg-light border-0 rounded-3 text-danger fw-bold">
                                </div>
                                <div class="col-6 col-md-3">
                                    <label class="form-label text-secondary small mb-1">Data</label>
                                    <input type="date" name="data_{{ t.id_temp }}" value="{{ t.data }}" class="form-control bg-light border-0 rounded-3">
                                </div>
                                <div class="col-6 col-md-6">
                                    <label class="form-label text-secondary small mb-1">Categoria</label>
                                    <select name="cat_{{ t.id_temp }}" class="form-select bg-light border-0 rounded-3">
                                        <option value="Alimentação" {% if t.categoria == 'Alimentação' %}selected{% endif %}>Alimentação</option>
                                        <option value="Mercado" {% if t.categoria == 'Mercado' %}selected{% endif %}>Mercado</option>
                                        <option value="Transporte" {% if t.categoria == 'Transporte' %}selected{% endif %}>Transporte</option>
                                        <option value="Moradia" {% if t.categoria == 'Moradia' %}selected{% endif %}>Moradia</option>
                                        <option value="Saúde" {% if t.categoria == 'Saúde' %}selected{% endif %}>Saúde</option>
                                        <option value="Lazer" {% if t.categoria == 'Lazer' %}selected{% endif %}>Lazer</option>
                                        <option value="Compras" {% if t.categoria == 'Compras' %}selected{% endif %}>Compras</option>
                                        <option value="Assinaturas" {% if t.categoria == 'Assinaturas' %}selected{% endif %}>Assinaturas</option>
                                        <option value="Outros" {% if t.categoria == 'Outros' %}selected{% endif %}>Outros</option>
                                    </select>
                                </div>
                                <div class="col-6 col-md-6">
                                    <label class="form-label text-secondary small mb-1">Dono do Gasto</label>
                                    <select name="dono_{{ t.id_temp }}" class="form-select bg-light border-0 rounded-3">
                                        {% for p in pessoas %}
                                        <option value="{{ p.id }}" {% if p.is_titular %}selected{% endif %}>{{ p.nome }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                        </div>
                        {% endfor %}
                    </div>

                    <div class="mt-4 text-center">
                        <button type="submit" class="btn btn-primary rounded-pill w-100 py-3 fw-bold shadow-sm">
                            <i class="bi bi-cloud-arrow-up"></i> Confirmar Importação
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
