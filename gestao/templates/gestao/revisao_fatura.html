<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisão de Fatura - FinPro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; overflow-x: hidden; }
        .app-shell { max-width: 820px; margin: 0 auto; padding: 0 14px 80px 14px; }
        .form-control, .form-select { font-size: 16px !important; border-radius: 10px; }
        .item-duplicado { opacity: 0.65; border-left: 4px solid #d97706 !important; }
    </style>
</head>
<body>
    <header class="bg-white border-bottom sticky-top py-2 mb-3">
        <div class="app-shell d-flex justify-content-between align-items-center" style="padding-bottom: 0;">
            <span class="fw-bold fs-5"><i class="bi bi-wallet2 text-primary me-1"></i>FinPro</span>
            <a href="{% url 'dashboard' %}" class="btn btn-sm btn-outline-secondary rounded-3 px-3">Cancelar</a>
        </div>
    </header>

    <main class="app-shell">
        <div class="bg-white border rounded-4 p-3 p-md-4">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                <div>
                    <h6 class="fw-bold mb-0">Revisão de fatura importada</h6>
                    <span class="text-secondary small">{{ transacoes_fatura|length }} lançamentos identificados</span>
                </div>
                <div class="bg-light border px-3 py-1 rounded-3 small fw-semibold">
                    Total selecionado: R$ <span id="spanTotalSelecionado">{{ total_fatura_importada|floatformat:2 }}</span>
                </div>
            </div>

            <form method="POST" action="{% url 'dashboard' %}">
                {% csrf_token %}
                <input type="hidden" name="form_type" value="salvar_fatura_lote">

                <div class="mb-3 p-3 bg-light rounded-3 border">
                    <label class="form-label small fw-semibold text-secondary mb-1">Vincular lançamentos ao cartão</label>
                    <select class="form-select bg-white" name="cartao_lote" id="selectCartaoLote" required>
                        {% if cartoes %}
                            {% for c in cartoes %}
                            <option value="{{ c.id }}" {% if forloop.first %}selected{% endif %}>{{ c.nome }} (Fechamento dia {{ c.dia_fechamento }})</option>
                            {% endfor %}
                            <option value="NOVO_CARTAO">Criar novo cartão...</option>
                            <option value="SEM_CARTAO">Pix / Conta corrente (Sem cartão)</option>
                        {% else %}
                            <option value="NOVO_CARTAO" selected>Criar novo cartão</option>
                            <option value="SEM_CARTAO">Pix / Conta corrente (Sem cartão)</option>
                        {% endif %}
                    </select>

                    <div id="boxNovoCartaoLote" class="row g-2 mt-2" style="display: {% if not cartoes %}flex{% else %}none{% endif %};">
                        <div class="col-12 col-sm-6">
                            <input type="text" class="form-control bg-white" name="novo_cartao_lote_nome" placeholder="Nome do cartão" value="{% if not cartoes %}Nubank{% endif %}">
                        </div>
                        <div class="col-6 col-sm-3">
                            <input type="number" class="form-control bg-white" name="novo_cartao_fechamento" placeholder="Fechamento" value="25" min="1" max="31">
                        </div>
                        <div class="col-6 col-sm-3">
                            <input type="number" class="form-control bg-white" name="novo_cartao_vencimento" placeholder="Vencimento" value="5" min="1" max="31">
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-end mb-2">
                    <button type="button" class="btn btn-sm btn-link text-decoration-none p-0" id="btnMarcarTodos">Inverter seleção</button>
                </div>

                <div class="mb-3">
                    {% for t in transacoes_fatura %}
                    <div class="border rounded-3 p-3 mb-2 bg-white {% if t.duplicada %}item-duplicado{% endif %}">
                        <div class="d-flex justify-content-between align-items-center mb-2 pb-1 border-bottom">
                            <div class="form-check">
                                <input type="checkbox" name="importar_chk" value="{{ t.id_temp }}" {% if not t.duplicada %}checked{% endif %} class="form-check-input chk-item-fatura" id="chk_{{ t.id_temp }}">
                                <label class="form-check-label small fw-semibold" for="chk_{{ t.id_temp }}">Importar lançamento</label>
                            </div>
                            {% if t.duplicada %}
                            <span class="badge bg-warning text-dark">Já existente</span>
                            {% endif %}
                        </div>

                        <div class="row g-2">
                            <div class="col-12 col-md-5">
                                <input type="text" name="desc_{{ t.id_temp }}" value="{{ t.descricao }}" class="form-control form-control-sm">
                            </div>
                            <div class="col-6 col-md-2">
                                <input type="text" name="valor_{{ t.id_temp }}" value="{{ t.valor|floatformat:2 }}" class="form-control form-control-sm fw-semibold input-valor-fatura">
                            </div>
                            <div class="col-6 col-md-2">
                                <input type="date" name="data_{{ t.id_temp }}" value="{{ t.data }}" class="form-control form-control-sm">
                            </div>
                            <div class="col-6 col-md-2">
                                <select name="cat_{{ t.id_temp }}" class="form-select form-select-sm">
                                    <option value="Alimentação" {% if t.categoria == 'Alimentação' %}selected{% endif %}>Alimentação</option>
                                    <option value="Mercado" {% if t.categoria == 'Mercado' %}selected{% endif %}>Mercado</option>
                                    <option value="Transporte" {% if t.categoria == 'Transporte' %}selected{% endif %}>Transporte</option>
                                    <option value="Moradia" {% if t.categoria == 'Moradia' %}selected{% endif %}>Moradia</option>
                                    <option value="Saúde" {% if t.categoria == 'Saúde' %}selected{% endif %}>Saúde</option>
                                    <option value="Lazer" {% if t.categoria == 'Lazer' %}selected{% endif %}>Lazer</option>
                                    <option value="Compras" {% if t.categoria == 'Compras' %}selected{% endif %}>Compras</option>
                                    <option value="Assinaturas" {% if t.categoria == 'Assinaturas' %}selected{% endif %}>Assinaturas</option>
                                    <option value="Outros" {% if t.categoria == 'Outros' %}selected{% endif %}>Outros</option>
                                </select>
                            </div>
                            <div class="col-6 col-md-1">
                                <select name="dono_{{ t.id_temp }}" class="form-select form-select-sm">
                                    {% for p in pessoas %}
                                    <option value="{{ p.id }}" {% if p.is_titular %}selected{% endif %}>{{ p.nome }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                    </div>
                    {% endfor %}
                </div>

                <button type="submit" class="btn btn-primary w-100 rounded-3 py-2 fw-semibold">
                    Confirmar importação
                </button>
            </form>
        </div>
    </main>

    <script>
        const selectCartao = document.getElementById('selectCartaoLote');
        const boxNovoCartao = document.getElementById('boxNovoCartaoLote');
        if (selectCartao && boxNovoCartao) {
            selectCartao.addEventListener('change', function() {
                boxNovoCartao.style.display = (this.value === 'NOVO_CARTAO') ? 'flex' : 'none';
            });
        }

        function recalcularTotalSelecionado() {
            let soma = 0;
            document.querySelectorAll('.chk-item-fatura').forEach(chk => {
                if (chk.checked) {
                    const card = chk.closest('.border');
                    const valStr = card.querySelector('.input-valor-fatura').value.replace('.', '').replace(',', '.');
                    soma += parseFloat(valStr) || 0;
                }
            });
            document.getElementById('spanTotalSelecionado').textContent = soma.toFixed(2).replace('.', ',');
        }

        document.querySelectorAll('.chk-item-fatura, .input-valor-fatura').forEach(el => {
            el.addEventListener('change', recalcularTotalSelecionado);
        });

        document.getElementById('btnMarcarTodos').addEventListener('click', function() {
            const checks = document.querySelectorAll('.chk-item-fatura');
            const algumDesmarcado = Array.from(checks).some(c => !c.checked);
            checks.forEach(c => c.checked = algumDesmarcado);
            recalcularTotalSelecionado();
        });
    </script>
</body>
</html>
