{% load static %}
<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="referrer" content="same-origin">
    <title>Criar Nova Senha | FinPro</title>
    <link rel="icon" type="image/png" href="{% static 'icone.png' %}">

    <script>
        (function () {
            if (localStorage.getItem('finpro_dark_mode') === 'true') {
                document.documentElement.setAttribute('data-bs-theme', 'dark');
            }
        })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-app: #f4f6f9;
            --bg-surface: #ffffff;
            --bg-subtle: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --border-color: #e2e8f0;
            --border-strong: #cbd5e1;
            --accent: #1d4ed8;
            --accent-hover: #1e40af;
        }
        [data-bs-theme="dark"] {
            --bg-app: #0b1120;
            --bg-surface: #111827;
            --bg-subtle: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #1f2937;
            --border-strong: #334155;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
        }
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-app);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }
        .auth-card {
            width: 100%;
            max-width: 410px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
        }
        .form-control {
            font-size: 16px !important;
            border-radius: 8px !important;
            background-color: var(--bg-subtle);
            border: 1px solid var(--border-strong);
            color: var(--text-primary);
            min-height: 44px;
        }
        .form-control:focus {
            background-color: var(--bg-surface);
            color: var(--text-primary);
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
        }
        .btn-fin-primary {
            background-color: var(--accent);
            border: 1px solid var(--accent);
            color: #ffffff;
            border-radius: 10px;
            font-size: 0.92rem;
            font-weight: 600;
            min-height: 44px;
        }
        .btn-fin-primary:hover, .btn-fin-primary:focus {
            background-color: var(--accent-hover);
            border-color: var(--accent-hover);
            color: #ffffff;
        }
        .text-secondary-fin { color: var(--text-secondary) !important; }
    </style>
</head>
<body class="d-flex flex-column align-items-center justify-content-center min-vh-100 p-3">
    <main class="auth-card p-4">
        <div class="text-center mb-4">
            <img src="{% static 'icone.png' %}" alt="Logotipo FinPro" width="42" height="42" class="mb-2" style="border-radius: 8px;">
            <h1 class="h5 fw-bold mb-1">Definir nova senha</h1>
            <p class="text-secondary-fin small mb-0">Conta: <strong>{{ usuario_alvo.username }}</strong></p>
        </div>

        <form method="POST" id="formNovaSenha">
            {% csrf_token %}
            {{ form }}
            <div class="form-check mt-1 mb-3">
                <input class="form-check-input" type="checkbox" id="chkMostrarNovaSenha">
                <label class="form-check-label small text-secondary-fin" for="chkMostrarNovaSenha" style="cursor: pointer;">
                    Mostrar senhas
                </label>
            </div>
            <button type="submit" id="btnSalvarSenha" class="btn btn-fin-primary w-100">
                Salvar nova senha
            </button>
        </form>
    </main>

    <script>
        document.querySelectorAll('#formNovaSenha input').forEach(e => {
            if (e.type !== 'submit' && e.type !== 'hidden' && e.type !== 'checkbox') {
                e.classList.add('form-control', 'mb-2', 'py-2');
                e.setAttribute('autocomplete', 'new-password');
            }
        });
        document.querySelectorAll('#formNovaSenha label').forEach(e => {
            if (e.htmlFor !== 'chkMostrarNovaSenha') {
                e.classList.add('small', 'text-secondary-fin', 'fw-semibold', 'mb-1');
            }
        });
        document.querySelectorAll('.helptext').forEach(e => e.classList.add('d-block', 'small', 'text-secondary-fin', 'mb-2'));
        document.querySelectorAll('ul.errorlist').forEach(e => {
            e.classList.add('list-unstyled', 'text-danger', 'small', 'bg-danger', 'bg-opacity-10', 'p-2', 'rounded-2');
        });
        document.getElementById('chkMostrarNovaSenha').addEventListener('change', function() {
            document.querySelectorAll('input[name="new_password1"], input[name="new_password2"]').forEach(inp => {
                inp.type = this.checked ? 'text' : 'password';
            });
        });
        document.getElementById('formNovaSenha').addEventListener('submit', function() {
            const btn = document.getElementById('btnSalvarSenha');
            btn.disabled = true;
            btn.textContent = 'Salvando...';
        });
    </script>
</body>
</html>
