{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Nova Senha | FinPro</title>
    <link rel="icon" type="image/png" href="{% static 'icone.png' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .form-control, .btn { font-size: 16px !important; border-radius: 6px !important; }
    </style>
</head>
<body class="d-flex flex-column align-items-center justify-content-center min-vh-100 p-3">
    <main class="bg-white border rounded-2 p-4 shadow-sm" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-3">
            <img src="{% static 'icone.png' %}" alt="Logotipo FinPro" width="40" height="40" class="mb-2" style="border-radius: 6px;">
            <h1 class="h5 fw-bold mb-1">Definir nova senha</h1>
            <p class="text-secondary small mb-0">Conta: <strong>{{ usuario_alvo.username }}</strong></p>
        </div>

        <form method="POST" id="formNovaSenha">
            {% csrf_token %}
            {{ form }}
            <button type="submit" id="btnSalvarSenha" class="btn btn-primary w-100 py-2 fw-semibold mt-2">
                Salvar nova senha
            </button>
        </form>
    </main>
    <script>
        document.querySelectorAll('input').forEach(e => {
            if(e.type !== 'submit' && e.type !== 'hidden') {
                e.classList.add('form-control', 'bg-light', 'mb-2', 'py-2');
            }
        });
        document.querySelectorAll('label').forEach(e => e.classList.add('small', 'text-secondary', 'fw-semibold', 'mb-1'));
        document.querySelectorAll('.helptext').forEach(e => e.classList.add('d-block', 'small', 'text-secondary', 'mb-2'));
        document.querySelectorAll('ul.errorlist').forEach(e => {
            e.classList.add('list-unstyled', 'text-danger', 'small', 'bg-danger', 'bg-opacity-10', 'p-2', 'rounded-2');
        });
    </script>
</body>
</html>
