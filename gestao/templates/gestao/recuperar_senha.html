{% load static %}
<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Recuperar Senha | FinPro</title>
    <link rel="icon" type="image/png" href="{% static 'icone.png' %}">

    <script>
        (function () {
            if (localStorage.getItem('finpro_dark_mode') === 'true') {
                document.documentElement.setAttribute('data-bs-theme', 'dark');
            }
        })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-app: #f4f6f9;
            --bg-surface: #ffffff;
            --bg-subtle: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --border-color: #e2e8f0;
            --border-strong: #cbd5e1;
            --accent: #1d4ed8;
            --accent-hover: #1e40af;
        }
        [data-bs-theme="dark"] {
            --bg-app: #0b1120;
            --bg-surface: #111827;
            --bg-subtle: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #1f2937;
            --border-strong: #334155;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
        }
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-app);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }
        .auth-card {
            width: 100%;
            max-width: 400px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
        }
        .form-control {
            font-size: 16px !important;
            border-radius: 8px !important;
            background-color: var(--bg-subtle);
            border: 1px solid var(--border-strong);
            color: var(--text-primary);
            min-height: 44px;
        }
        .form-control:focus {
            background-color: var(--bg-surface);
            color: var(--text-primary);
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
        }
        .btn-fin-primary {
            background-color: var(--accent);
            border: 1px solid var(--accent);
            color: #ffffff;
            border-radius: 10px;
            font-size: 0.92rem;
            font-weight: 600;
            min-height: 44px;
        }
        .btn-fin-primary:hover, .btn-fin-primary:focus {
            background-color: var(--accent-hover);
            border-color: var(--accent-hover);
            color: #ffffff;
        }
        .text-secondary-fin { color: var(--text-secondary) !important; }
    </style>
</head>
<body class="d-flex flex-column align-items-center justify-content-center min-vh-100 p-3">
    <main class="auth-card p-4">
        <div class="text-center mb-4">
            <img src="{% static 'icone.png' %}" alt="Logotipo FinPro" width="42" height="42" class="mb-2" style="border-radius: 8px;">
            <h1 class="h5 fw-bold mb-1">Redefinir senha</h1>
            <p class="text-secondary-fin small mb-0">Informe seu e-mail ou nome de usuário para receber um link seguro válido por 30 minutos.</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{% if message.tags == 'error' %}danger{% elif message.tags == 'warning' %}warning{% else %}success{% endif %} rounded-3 small py-2" role="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST" id="formRecuperar">
            {% csrf_token %}
            <input type="text" name="website_url_honeypot" style="display:none;" tabindex="-1" autocomplete="off">
            <div class="mb-3">
                <label for="inputIdentificador" class="form-label small text-secondary-fin fw-semibold mb-1">E-mail ou Nome de usuário</label>
                <input type="text" id="inputIdentificador" name="identificador" class="form-control py-2" placeholder="seuemail@exemplo.com" autocomplete="username" required>
            </div>
            <button type="submit" id="btnEnviarLink" class="btn btn-fin-primary w-100">
                Enviar link de redefinição
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="{% url 'login' %}" class="small text-secondary-fin text-decoration-none">Voltar para o login</a>
        </div>
    </main>

    <script>
        document.getElementById('formRecuperar').addEventListener('submit', function() {
            const btn = document.getElementById('btnEnviarLink');
            btn.disabled = true;
            btn.textContent = 'Enviando...';
        });
    </script>
</body>
</html>
