{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha | FinPro</title>
    <link rel="icon" type="image/png" href="{% static 'icone.png' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .form-control, .btn { font-size: 16px !important; border-radius: 6px !important; }
    </style>
</head>
<body class="d-flex flex-column align-items-center justify-content-center min-vh-100 p-3">
    <main class="bg-white border rounded-2 p-4 shadow-sm" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-3">
            <img src="{% static 'icone.png' %}" alt="Logotipo FinPro" width="40" height="40" class="mb-2" style="border-radius: 6px;">
            <h1 class="h5 fw-bold mb-1">Redefinir senha</h1>
            <p class="text-secondary small mb-0">Informe o e-mail ou nome de usuário vinculado à sua conta para receber o link de redefinição.</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger rounded-2 small py-2" role="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST" id="formRecuperar">
            {% csrf_token %}
            <div class="mb-3">
                <label for="inputIdentificador" class="form-label small text-secondary fw-semibold mb-1">E-mail ou Nome de usuário</label>
                <input type="text" id="inputIdentificador" name="identificador" class="form-control bg-light py-2" placeholder="seuemail@exemplo.com" required>
            </div>
            <button type="submit" id="btnEnviarLink" class="btn btn-primary w-100 py-2 fw-semibold">
                Enviar link de redefinição
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="{% url 'login' %}" class="small text-secondary text-decoration-none">Voltar para o login</a>
        </div>
    </main>
    <script>
        document.getElementById('formRecuperar').addEventListener('submit', function() {
            const btn = document.getElementById('btnEnviarLink');
            btn.disabled = true;
            btn.innerHTML = 'Enviando...';
        });
    </script>
</body>
</html>
