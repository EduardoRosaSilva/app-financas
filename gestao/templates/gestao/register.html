<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinPro - Criar Conta</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #f0f4ff 0%, #f8fafc 100%); }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="card border-0 shadow-lg rounded-4 p-4" style="width: 100%; max-width: 450px; margin: 20px;">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-2" style="width: 56px; height: 56px;">
                <i class="bi bi-person-plus-fill fs-3"></i>
            </div>
            <h3 class="fw-bold text-primary mb-0">FinPro</h3>
            <p class="text-muted small mb-0">Crie sua conta gratuita protegida pela LGPD</p>
        </div>
        
        <form method="POST" id="formRegistro">
            {% csrf_token %}
            <input type="text" name="website_url_honeypot" style="display:none;" tabindex="-1" autocomplete="off">

            {{ form }}
            <div class="form-check mt-1 mb-3 ms-1">
                <input class="form-check-input" type="checkbox" id="chkMostrarSenhaReg">
                <label class="form-check-label small text-secondary" for="chkMostrarSenhaReg" style="cursor: pointer;">
                    Mostrar senhas digitadas
                </label>
            </div>
            <button type="submit" id="btnSubmitReg" class="btn btn-primary w-100 rounded-pill py-2 fw-bold shadow-sm">
                Cadastrar e Entrar
            </button>
        </form>
        <div class="text-center mt-4">
            <a href="{% url 'login' %}" class="text-decoration-none small text-secondary">Já possui conta? <span class="text-primary fw-bold">Fazer login</span></a>
        </div>
    </div>
    
    <script>
        document.querySelectorAll('input').forEach(e => {
            if(e.type !== 'submit' && e.type !== 'checkbox' && e.name !== 'website_url_honeypot') {
                e.classList.add('form-control', 'bg-light', 'border-0', 'rounded-4', 'mb-2', 'py-2');
            }
        });
        document.querySelectorAll('label').forEach(e => {
            if(e.htmlFor !== 'chkMostrarSenhaReg') {
                e.classList.add('small', 'text-muted', 'fw-bold', 'mb-1', 'ms-1');
            }
        });
        document.querySelectorAll('.helptext').forEach(e => e.classList.add('d-block', 'small', 'text-secondary', 'mb-3', 'ms-1'));
        document.querySelectorAll('ul.errorlist').forEach(e => {
            e.classList.add('list-unstyled', 'text-danger', 'small', 'bg-danger', 'bg-opacity-10', 'p-2', 'rounded-3');
        });
        document.getElementById('chkMostrarSenhaReg').addEventListener('change', function() {
            document.querySelectorAll('input[name="password1"], input[name="password2"]').forEach(inp => {
                inp.type = this.checked ? 'text' : 'password';
            });
        });
        document.getElementById('formRegistro').addEventListener('submit', function() {
            const btn = document.getElementById('btnSubmitReg');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Criando conta...';
        });
    </script>
</body>
</html>
