<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinPro - Criar Conta</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; }</style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="card border-0 shadow-lg rounded-4 p-4" style="width: 100%; max-width: 450px; margin: 20px;">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-primary mb-0"><i class="bi bi-wallet2"></i> FinPro</h3>
            <p class="text-muted small">Crie sua conta gratuitamente</p>
        </div>
        
        <form method="POST">
            {% csrf_token %}
            {{ form }}
            <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 mt-3 fw-bold shadow-sm">Cadastrar e Entrar</button>
        </form>
        <div class="text-center mt-4">
            <a href="{% url 'login' %}" class="text-decoration-none small text-secondary">Já possui conta? <span class="text-primary fw-bold">Fazer login</span></a>
        </div>
    </div>
    
    <script>
        document.querySelectorAll('input').forEach(e => {
            if(e.type !== 'submit' && e.type !== 'checkbox') {
                e.classList.add('form-control', 'bg-light', 'border-0', 'rounded-4', 'mb-3', 'py-2');
            }
        });
        document.querySelectorAll('label').forEach(e => e.classList.add('small', 'text-muted', 'fw-bold', 'mb-1', 'ms-1'));
        document.querySelectorAll('.helptext').forEach(e => e.classList.add('d-block', 'small', 'text-secondary', 'mb-3', 'ms-1'));
        document.querySelectorAll('ul.errorlist').forEach(e => {
            e.classList.add('list-unstyled', 'text-danger', 'small', 'bg-danger', 'bg-opacity-10', 'p-2', 'rounded-3');
        });
    </script>
</body>
</html>
